name: cf-page-store

on:
  push:
  pull_request:

jobs:
  cf-page-store-tests:
    name: cf-page-store tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('cf-page-store/bun.lock') }}
      - run: bun install --frozen-lockfile
        working-directory: cf-page-store
      - run: bun run test
        working-directory: cf-page-store
      - run: bun run typecheck
        working-directory: cf-page-store
