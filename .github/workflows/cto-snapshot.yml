name: cto-snapshot

on:
  push:
  pull_request:

jobs:
  cto-snapshot-go-tests:
    name: cto-snapshot Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cto/snapshot/go.mod
      - run: go test ./...
        working-directory: cto/snapshot
