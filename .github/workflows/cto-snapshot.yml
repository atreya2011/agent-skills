name: cto-snapshot

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cto-snapshot.yml'
      - 'cto/snapshot/**'
      - 'cto/references/local-file.md'
  pull_request:
    paths:
      - '.github/workflows/cto-snapshot.yml'
      - 'cto/snapshot/**'
      - 'cto/references/local-file.md'

jobs:
  cto-snapshot-go-tests:
    name: cto-snapshot Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cto/snapshot/go.mod
      - run: go test ./...
        working-directory: cto/snapshot
