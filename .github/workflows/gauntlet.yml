name: gauntlet

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/gauntlet.yml'
      - 'tests/gauntlet/**'
      - 'gauntlet/seats.sh'
      - 'gauntlet/close-decision.sh'
      - 'gauntlet/send.sh'
      - 'gauntlet/receipt.sh'
  pull_request:
    paths:
      - '.github/workflows/gauntlet.yml'
      - 'tests/gauntlet/**'
      - 'gauntlet/seats.sh'
      - 'gauntlet/close-decision.sh'
      - 'gauntlet/send.sh'
      - 'gauntlet/receipt.sh'

jobs:
  gauntlet-tests:
    name: gauntlet ${{ matrix.test }} tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test: [seats, close-decision, send, receipt]
    steps:
      - uses: actions/checkout@v4
      # No herdr on the runner: send.test.sh passes without it and receipt.test.sh skips.
      - run: tests/gauntlet/${{ matrix.test }}.test.sh
