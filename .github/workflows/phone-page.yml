name: phone-page

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/phone-page.yml'
      - 'tests/phone-page/**'
      - 'phone-page/phone-page'
      - 'phone-page/question-page.html'
      - 'phone-page/assets.json'
  pull_request:
    paths:
      - '.github/workflows/phone-page.yml'
      - 'tests/phone-page/**'
      - 'phone-page/phone-page'
      - 'phone-page/question-page.html'
      - 'phone-page/assets.json'

jobs:
  phone-page-shell-tests:
    name: phone-page shell tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/phone-page/phone-page.test.sh

  phone-page-playwright-tests:
    name: phone-page Playwright tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/phone-page/package-lock.json
      - run: npm ci
        working-directory: tests/phone-page
      - run: npx playwright install --with-deps chromium webkit
        working-directory: tests/phone-page
      - run: npm test
        working-directory: tests/phone-page
