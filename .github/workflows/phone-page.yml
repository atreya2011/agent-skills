name: phone-page

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/phone-page.yml'
      - 'tests/phone-page/**'
      - 'phone-page/phone-page'
      - 'phone-page/page.html'
      - 'phone-page/validate.jq'
      - 'phone-page/assets.json'
  pull_request:
    paths:
      - '.github/workflows/phone-page.yml'
      - 'tests/phone-page/**'
      - 'phone-page/phone-page'
      - 'phone-page/page.html'
      - 'phone-page/validate.jq'
      - 'phone-page/assets.json'

jobs:
  phone-page-shell-tests:
    name: phone-page shell tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: tests/phone-page/phone-page.test.sh

  phone-page-playwright-tests:
    name: phone-page Playwright tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('tests/phone-page/bun.lock') }}
      - run: bun install --frozen-lockfile
        working-directory: tests/phone-page
      - run: bun --bun playwright install --with-deps chromium webkit
        working-directory: tests/phone-page
      - run: bun run test
        working-directory: tests/phone-page
