name: phone-page

on:
  push:
  pull_request:

jobs:
  phone-page-shell-tests:
    name: phone-page shell tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/phone-page/phone-page.test.sh

  phone-page-playwright-tests:
    name: phone-page Playwright tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('tests/phone-page/bun.lock') }}
      - run: bun install --frozen-lockfile
        working-directory: tests/phone-page
      - run: bun --bun playwright install --with-deps chromium webkit
        working-directory: tests/phone-page
      - run: bun run test
        working-directory: tests/phone-page
