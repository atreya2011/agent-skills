name: portability

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  portability-check:
    name: portability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No ~/.agents/local on the runner, so only the built-in patterns run.
      - run: ./portability-check.sh

  portability-tests:
    name: portability tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./portability-check.test.sh
