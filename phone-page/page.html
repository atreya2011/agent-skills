<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e0f0c">
  <link rel="icon" href="data:,">
  <title>Questions</title>
  <style>
    @font-face { font-family: Figtree; font-style: normal; font-weight: 900; font-display: swap; src: url('/assets/figtree-900.woff2') format('woff2'); }
    @font-face { font-family: Inter; font-style: normal; font-weight: 400; font-display: swap; src: url('/assets/inter-400.woff2') format('woff2'); }
    @font-face { font-family: Inter; font-style: normal; font-weight: 500; font-display: swap; src: url('/assets/inter-500.woff2') format('woff2'); }
    @font-face { font-family: Inter; font-style: normal; font-weight: 600; font-display: swap; src: url('/assets/inter-600.woff2') format('woff2'); }
    :root { color-scheme: dark; font-family: Inter, sans-serif; background: #0e0f0c; color: #e8ebe6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; padding-top: calc(44px + env(safe-area-inset-top)); background: #0e0f0c; }
    button, input, textarea { font: inherit; }
    button, input, textarea, label { -webkit-tap-highlight-color: transparent; }
    .progress { position: fixed; z-index: 2; top: 0; left: 0; width: 100%; padding: calc(12px + env(safe-area-inset-top)) 16px 12px; border-bottom: 1px solid #2c3029; background: #0e0f0c; }
    .progress-inner { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; width: min(100%, 720px); margin: 0 auto; }
    .progress-track { height: 4px; overflow: hidden; border-radius: 999px; background: #2c3029; }
    .progress-fill { width: 0; height: 100%; border-radius: inherit; background: #9fe870; transition: width 160ms ease-out; }
    .progress-count { color: #a3a9a0; font-size: .75rem; white-space: nowrap; }
    main { width: min(100%, 752px); margin: 0 auto; padding: 40px 16px calc(128px + env(safe-area-inset-bottom)); }
    .masthead { margin: 0 0 32px; }
    .eyebrow { margin: 0 0 10px; color: #9fe870; font-size: .75rem; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; }
    h1, h2 { overflow-wrap: anywhere; font-family: Figtree, sans-serif; font-weight: 900; letter-spacing: -.03em; }
    [x-cloak] { display: none !important; }
    [hidden] { display: none !important; }
    h1 { margin: 0; color: #9fe870; font-size: clamp(2.5rem, 12vw, 4.75rem); line-height: .95; }
    .intro { max-width: 560px; margin: 18px 0 0; color: #a3a9a0; font-size: 1rem; line-height: 1.6; }
    .intro.summary { color: #e8ebe6; font-size: 17px; font-weight: 500; line-height: 1.55; overflow-wrap: anywhere; }
    .latest { display: flex; gap: 10px; align-items: center; margin: 20px 0 0; padding: 12px 16px; border: 1px solid #2c3029; border-radius: 999px; color: #e8ebe6; background: #191b16; font-size: .875rem; }
    .latest svg { width: 18px; color: #9fe870; }
    .questions, .read-sections { display: grid; gap: 16px; }
    .section-content { min-width: 0; }
    .read-page { padding-top: 0; }
    .read-page main { padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
    .question-card, .read-section { min-width: 0; margin: 0; padding: 24px; border: 1px solid #2c3029; border-radius: 24px; background: #191b16; }
    .question-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .header { color: #9fe870; font-size: .75rem; font-weight: 600; letter-spacing: .11em; text-transform: uppercase; }
    .count { color: #a3a9a0; font-size: .75rem; }
    h2 { margin: 0; font-size: clamp(1.5rem, 7vw, 2.1rem); line-height: 1.08; }
    .context { margin: 12px 0 0; padding-left: 22px; color: #a3a9a0; font-size: 17px; line-height: 1.55; overflow-wrap: anywhere; }
    .context li + li { margin-top: 8px; }
    .context ul { margin-top: 8px; padding-left: 22px; }
    .cards { margin-top: 20px; container-type: inline-size; }
    .cards-grid { display: grid; gap: 12px; }
    .card { min-width: 0; padding: 12px 14px; border: 1px solid #2c3029; border-radius: 12px; background: #0e0f0c; }
    .card-title { display: flex; gap: 8px; align-items: center; margin: 0 0 4px; color: #e8ebe6; font-size: 17px; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
    .card-title svg { flex: none; width: 20px; height: 20px; color: #9fe870; }
    .card-text { margin: 0; color: #a3a9a0; font-size: 17px; line-height: 1.55; overflow-wrap: anywhere; }
    @container (min-width: 500px) {
      .cards-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .table-wrap { margin-top: 20px; overflow-x: auto; }
    .table { width: 100%; border-collapse: collapse; font-size: 17px; line-height: 1.45; }
    .table th, .table td { padding: 10px 8px; border-bottom: 1px solid #2c3029; text-align: left; vertical-align: top; overflow-wrap: normal; }
    .table th { color: #a3a9a0; font-size: .75rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
    .table td { color: #a3a9a0; }
    .table td:first-child { color: #e8ebe6; font-weight: 500; }
    .flow { margin-top: 20px; container-type: inline-size; }
    .flow-label { margin: 0 0 8px; color: #9fe870; font-size: .75rem; font-weight: 600; letter-spacing: .11em; text-transform: uppercase; overflow-wrap: anywhere; }
    .flow-box { min-width: 0; padding: 12px 14px; border: 1px solid #2c3029; border-radius: 12px; background: #0e0f0c; color: #a3a9a0; font-size: 17px; line-height: 1.55; overflow-wrap: anywhere; }
    .flow-decision { border-color: #9fe870; color: #e8ebe6; }
    .flow-arrow { display: block; color: #9fe870; text-align: center; font-size: 24px; line-height: 32px; }
    .flow-split { width: calc(50% - 18px); height: 18px; margin-left: 18px; border-right: 1px solid #9fe870; border-bottom: 1px solid #9fe870; }
    .flow-branches { display: grid; gap: 12px; margin: 0 0 0 18px; padding: 12px 0 0 20px; border-left: 1px solid #9fe870; }
    .flow-branch { position: relative; min-width: 0; }
    .flow-branch > .flow-arrow { position: absolute; top: 50%; left: -21px; width: 20px; line-height: 1; transform: translateY(-50%); }
    .flow-branch > .flow-arrow::before { content: '→'; }
    @container (min-width: 500px) {
      .flow-split { width: 1px; margin: 0 auto; border-bottom: 0; }
      .flow-branches { grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 12px; margin: 0; padding: 0; border-left: 0; }
      .flow-branch { padding-top: 32px; }
      .flow-branch > .flow-arrow { top: 0; left: 0; width: 100%; line-height: 32px; transform: none; }
      .flow-branch > .flow-arrow::before { content: '↓'; }
      .flow-branch::before { position: absolute; top: 0; right: -6px; left: -6px; border-top: 1px solid #9fe870; content: ''; }
      .flow-branch:first-child::before { left: 50%; }
      .flow-branch:last-child::before { right: 50%; }
    }
    .options { display: grid; gap: 10px; margin: 22px 0 0; }
    .option { display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: start; min-height: 58px; padding: 14px; border: 1px solid #2c3029; border-radius: 18px; background: #0e0f0c; cursor: pointer; }
    .option:hover { border-color: #a3a9a0; }
    .option:has(input:checked) { border-color: #9fe870; box-shadow: 0 0 0 1px #9fe870; }
    .option input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: #9fe870; }
    .option-copy { min-width: 0; }
    .option-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .option-label { font-weight: 600; }
    .option-description { display: block; margin-top: 5px; color: #a3a9a0; font-size: .875rem; line-height: 1.45; }
    .chip { padding: 3px 8px; border-radius: 999px; color: #0e0f0c; background: #9fe870; font-size: .68rem; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }
    .other-input, .note-field { margin-top: 14px; }
    .field-label { display: block; margin: 0 0 7px; color: #e8ebe6; font-size: .875rem; font-weight: 600; }
    input[type="text"], textarea { display: block; width: 100%; border: 1px solid #a3a9a0; border-radius: 14px; padding: 12px 14px; color: #e8ebe6; background: #0e0f0c; }
    textarea { min-height: 88px; resize: vertical; }
    input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid #9fe870; outline-offset: 3px; }
    .skip { min-height: 44px; margin-top: 10px; padding: 8px 2px; border: 0; color: #a3a9a0; background: transparent; text-decoration: underline; text-underline-offset: 4px; cursor: pointer; }
    .answer-panel { margin-top: 24px; padding: 24px; border: 1px solid #2c3029; border-radius: 24px; background: #191b16; }
    .answer-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; padding: 20px 0; border-bottom: 1px solid #2c3029; overflow-wrap: anywhere; }
    .answer-row:last-child { border-bottom: 0; }
    .answer-row h3 { margin: 8px 0; font-size: 17px; }
    .answer-row p { margin: 8px 0 0; color: #a3a9a0; line-height: 1.55; }
    .change, .navigation button { min-height: 44px; padding: 10px 18px; border: 1px solid #a3a9a0; border-radius: 999px; color: #e8ebe6; background: #0e0f0c; cursor: pointer; }
    .change { align-self: start; }
    .navigation { display: none; }
    .actions { display: grid; gap: 12px; margin-top: 24px; }
    .submit { display: inline-flex; justify-content: center; align-items: center; gap: 9px; min-height: 52px; width: 100%; border: 0; border-radius: 999px; padding: 13px 20px; color: #0e0f0c; background: #9fe870; font-weight: 600; cursor: pointer; }
    .submit:disabled { cursor: wait; opacity: .7; }
    .submit svg { width: 19px; }
    .error { margin: 0; color: #ffb4ab; line-height: 1.5; }
    .reply { margin: 4px 0 0; color: #a3a9a0; text-align: center; }
    .toast { position: fixed; z-index: 1; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom)); left: 16px; display: flex; align-items: center; gap: 10px; width: auto; max-width: none; padding: 14px 18px; border: 1px solid #9fe870; border-radius: 16px; color: #e8ebe6; background: #1f3a14; box-shadow: 0 8px 32px rgb(0 0 0 / 40%); }
    .toast svg { flex: 0 0 auto; width: 20px; color: #9fe870; }
    .toast.error-toast { border-color: #ffb4ab; background: #3f1611; }
    .toast.error-toast svg { color: #ffb4ab; }
    @media (min-width: 720px) {
      main { padding-top: 72px; }
      .question-card, .read-section { padding: 32px; }
      .toast { right: 24px; left: auto; width: max-content; max-width: 420px; }
    }
    @media (min-width: 960px) {
      body { height: 100dvh; overflow: hidden; }
      main { position: fixed; top: var(--progress-bottom, 44px); bottom: var(--navigation-height, 77px); left: 50%; width: min(100%, 1200px); padding: 16px 24px; transform: translateX(-50%); }
      .read-page main { top: 0; bottom: 0; overflow-y: auto; overscroll-behavior: contain; }
      .read-page .masthead { width: 100%; }
      .read-section { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 24px; }
      .read-section > .cards, .read-section > .table-wrap, .read-section > .flow { margin-top: 0; }
      .read-section > .table-wrap, .read-section > .flow { grid-column: 1 / -1; }
      .read-section.context-only { grid-template-columns: minmax(0, 1fr); }
      .read-section.context-only .section-content { width: min(100%, 720px); margin: 0 auto; }
      #question-form { display: flex; flex-direction: column; gap: 12px; height: 100%; }
      .questions { display: block; flex: 1; min-height: 0; }
      .review .questions { display: none; }
      .question-card { height: 100%; max-width: 720px; margin: 0 auto; width: 100%; }
      .question-card.with-context { max-width: none; }
      .question-part { display: flex; flex-direction: column; gap: 16px; height: 100%; min-height: 0; }
      .part-columns { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; flex: 1; min-height: 0; }
      .with-context .part-columns { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .with-context .part-columns.single-column { grid-template-columns: minmax(0, 1fr); width: calc((100% - 24px) / 2); align-self: center; }
      .single-column .screen-column:empty { display: none; }
      .screen-column { display: flex; flex-direction: column; gap: 20px; min-width: 0; min-height: 0; }
      .screen-column > * { flex: none; margin-top: 0; margin-bottom: 0; }
      .screen-column > .oversized-block { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
      .answer-controls > .options { margin-top: 0; }
      .part-heading { margin: 0; color: #a3a9a0; font-family: Inter, sans-serif; font-size: 17px; font-weight: 500; line-height: 1.4; letter-spacing: 0; }
      .answer-panel { flex: 1; min-height: 0; overflow-y: auto; width: min(100%, 720px); margin: 0 auto; }
      .actions { grid-template-columns: minmax(220px, 320px); justify-content: center; flex: none; margin-top: 0; }
      .navigation { position: fixed; z-index: 2; bottom: 0; left: 0; display: grid; grid-template-columns: 1fr auto 1fr; gap: 20px; align-items: center; width: 100%; padding: 16px 24px calc(16px + env(safe-area-inset-bottom)); border-top: 1px solid #2c3029; background: #0e0f0c; }
      .navigation button:first-child { justify-self: start; }
      .navigation button:last-child { justify-self: end; }
      .navigation button:disabled { opacity: .5; cursor: default; }
      .toast { bottom: calc(96px + env(safe-area-inset-bottom)); }
    }
  </style>
  <script src="/assets/lucide.min.js"></script>
  <script defer src="/assets/alpine-csp.min.js"></script>
</head>
<body x-data="phonePage" x-cloak x-on:resize.window="scheduleRepack" x-on:pointerdown.document.capture="pointerDown = true" x-on:pointerup.document.capture="pointerReleased" x-on:pointercancel.document.capture="pointerReleased" x-on:keydown.document="keyboardNavigation">
  <div class="progress">
    <div class="progress-inner">
      <div class="progress-track" id="progress-track" role="progressbar" aria-labelledby="progress-count" aria-valuemin="0" x-bind:aria-valuemax="questionCount" x-bind:aria-valuenow="answeredCount" x-bind:aria-valuetext="progressLabel">
        <div class="progress-fill" id="progress-fill" x-bind:style="progressStyle"></div>
      </div>
      <span class="progress-count" id="progress-count" x-text="progressLabel"></span>
    </div>
  </div>
  <main>
    <header class="masthead">
      <p class="eyebrow" x-text="isRead ? 'Readout' : 'Your call'"></p>
      <h1 id="page-title" tabindex="-1" x-text="title"></h1>
      <p class="intro" id="intro" x-bind:class="{ summary: hasSummary }" x-text="summary"></p>
      <div class="latest" id="latest" hidden>
        <i data-lucide="check-circle-2" aria-hidden="true"></i>
        <span id="latest-text"></span>
      </div>
      <p class="error" id="latest-error" aria-live="polite" hidden></p>
    </header>
    <form id="question-form" novalidate x-on:submit.prevent="submitAnswers">
      <div class="questions" id="questions"></div>
      <p class="error" id="form-error" role="alert" tabindex="-1" hidden></p>
      <section class="answer-panel" id="answer-panel" aria-labelledby="review-heading">
        <h2 id="review-heading" tabindex="-1" x-text="reviewTitle"></h2>
        <div id="answer-rows"></div>
      </section>
      <div class="actions" id="actions">
        <button class="submit" id="submit" type="submit" x-bind:disabled="submitting">
          <i data-lucide="send" aria-hidden="true"></i>
          Submit answers
        </button>
        <p class="reply" id="reply" aria-live="polite"></p>
      </div>
    </form>
  </main>
  <nav class="navigation" aria-label="Question screens">
    <button type="button" id="previous" x-bind:disabled="screen === 0" x-on:click="previousScreen">Previous</button>
    <span id="position" aria-live="polite" x-text="position"></span>
    <button type="button" id="next" x-bind:disabled="!ready" x-bind:hidden="reviewing" x-text="nextLabel" x-on:click="nextScreen">Next</button>
  </nav>
  <div class="toast" id="toast" hidden></div>
  <script type="application/json" id="spec">__PHONE_PAGE_SPEC__</script>
  <script>
    document.addEventListener('alpine:init', () => {
      function renderContext(items) {
        const context = document.createElement('ul');
        context.className = 'context';
        items.forEach((item) => {
          const bullet = document.createElement('li');
          bullet.textContent = typeof item === 'string' ? item : item.text;
          if (typeof item === 'object') {
            const items = document.createElement('ul');
            item.items.forEach((text) => {
              const subBullet = document.createElement('li');
              subBullet.textContent = text;
              items.append(subBullet);
            });
            bullet.append(items);
          }
          context.append(bullet);
        });
        return context;
      }

      function renderCards(items) {
        const cards = document.createElement('div');
        cards.className = 'cards';
        const grid = document.createElement('div');
        grid.className = 'cards-grid';
        items.forEach((item) => {
          const fact = document.createElement('div');
          fact.className = 'card';
          const title = document.createElement('p');
          title.className = 'card-title';
          if (item.icon) {
            const icon = document.createElement('i');
            icon.dataset.lucide = item.icon;
            icon.setAttribute('aria-hidden', 'true');
            title.append(icon);
          }
          title.append(document.createTextNode(item.title));
          const text = document.createElement('p');
          text.className = 'card-text';
          text.textContent = item.text;
          fact.append(title, text);
          grid.append(fact);
        });
        cards.append(grid);
        return cards;
      }

      function renderTable(data) {
        const wrap = document.createElement('div');
        wrap.className = 'table-wrap';
        wrap.tabIndex = 0;
        const table = document.createElement('table');
        table.className = 'table';
        const head = document.createElement('thead');
        const headRow = document.createElement('tr');
        data.columns.forEach((column) => {
          const cell = document.createElement('th');
          cell.scope = 'col';
          cell.textContent = column;
          headRow.append(cell);
        });
        head.append(headRow);
        const body = document.createElement('tbody');
        data.rows.forEach((row) => {
          const line = document.createElement('tr');
          row.forEach((value) => {
            const cell = document.createElement('td');
            cell.textContent = value;
            line.append(cell);
          });
          body.append(line);
        });
        table.append(head, body);
        wrap.append(table);
        return wrap;
      }

      function renderFlow(title, steps) {
        const flow = document.createElement('div');
        flow.className = 'flow';
        const label = document.createElement('p');
        label.className = 'flow-label';
        label.textContent = title;
        flow.append(label);
        function arrow() {
          const element = document.createElement('span');
          element.className = 'flow-arrow';
          element.setAttribute('aria-hidden', 'true');
          element.textContent = '↓';
          return element;
        }
        function box(text) {
          const element = document.createElement('div');
          element.className = 'flow-box';
          element.textContent = text;
          return element;
        }
        steps.forEach((item, stepIndex) => {
          if (stepIndex > 0) flow.append(arrow());
          const step = document.createElement('div');
          step.className = 'flow-step';
          const copy = box(typeof item === 'string' ? item : item.text);
          step.append(copy);
          if (typeof item === 'object') {
            copy.classList.add('flow-decision');
            const connector = document.createElement('div');
            connector.className = 'flow-split';
            connector.setAttribute('aria-hidden', 'true');
            step.append(connector);
            const branches = document.createElement('div');
            branches.className = 'flow-branches';
            item.branches.forEach((text) => {
              const branch = document.createElement('div');
              branch.className = 'flow-branch';
              const branchArrow = arrow();
              branchArrow.textContent = '';
              branch.append(branchArrow, box(text));
              branches.append(branch);
            });
            step.append(branches);
          }
          flow.append(step);
        });
        return flow;
      }


      function renderBlocks(blocks) {
        return {
          context: blocks.context ? renderContext(blocks.context) : null,
          cards: blocks.cards ? renderCards(blocks.cards) : null,
          table: blocks.table ? renderTable(blocks.table) : null,
          flows: blocks.flow ? [renderFlow('Flow', blocks.flow)] : (blocks.flows ?? []).map((chart) => renderFlow(chart.title, chart.steps))
        };
      }

      function renderSection(section, index) {
        const row = document.createElement('section');
        row.className = 'read-section';
        row.setAttribute('aria-labelledby', `section-heading-${index}`);
        const copy = document.createElement('div');
        copy.className = 'section-content';
        const heading = document.createElement('h2');
        heading.id = `section-heading-${index}`;
        heading.textContent = section.heading;
        copy.append(heading);
        const blocks = renderBlocks(section);
        if (blocks.context) copy.append(blocks.context);
        row.append(copy);
        if (blocks.cards) row.append(blocks.cards);
        if (blocks.table) row.append(blocks.table);
        row.append(...blocks.flows);
        if (!blocks.cards && !blocks.table && !blocks.flows.length) row.classList.add('context-only');
        return row;
      }

      Alpine.data('phonePage', () => {
        const spec = JSON.parse(document.getElementById('spec').textContent);
        const form = document.getElementById('question-form');
        const questionsRoot = document.getElementById('questions');
        const error = document.getElementById('form-error');
        const reply = document.getElementById('reply');
        const latest = document.getElementById('latest');
        const latestText = document.getElementById('latest-text');
        const latestError = document.getElementById('latest-error');
        const toast = document.getElementById('toast');
        const storageKey = `phone-page:${window.location.pathname}`;
        const desktop = window.matchMedia('(min-width: 960px)');
        const panel = document.getElementById('answer-panel');
        const rows = document.getElementById('answer-rows');
        const reviewHeading = document.getElementById('review-heading');
        const actions = document.getElementById('actions');
        const masthead = document.querySelector('.masthead');
        const page = Alpine.reactive({
          isRead: Array.isArray(spec.sections),
          title: spec.title,
          summary: spec.summary ?? 'Choose what you want now, add context where it helps, and leave anything you want to decide later.',
          hasSummary: Boolean(spec.summary),
          drafts: [],
          screens: [],
          questionLayouts: [],
          ready: false,
          packing: false,
          packedDesktop: undefined,
          desktopMode: desktop.matches,
          screen: 0,
          submitting: false,
          toastTimer: undefined,
          layoutFrame: undefined,
          pointerDown: false,
          repackPending: false,
          get questionCount() { return spec.questions?.length ?? 0; },
          get answeredCount() { return this.drafts.filter((draft) => draft.choices.length || (draft.otherSelected && draft.other.trim()) || draft.skipped).length; },
          get progressLabel() { return `${this.answeredCount} of ${this.questionCount} answered`; },
          get progressStyle() { return { width: `${this.questionCount ? this.answeredCount / this.questionCount * 100 : 0}%` }; },
          get reviewTitle() { return this.desktopMode ? 'Check your answers' : 'Your answers'; },
          get reviewing() { return this.screen === this.screens.length; },
          get nextLabel() { return this.screen === this.screens.length - 1 ? 'Review answers' : 'Next'; },
          get position() {
            if (!this.ready) return '';
            if (this.reviewing) return 'Review';
            const current = this.screens[this.screen];
            return `Question ${current.questionIndex + 1} of ${this.questionCount}${current.total > 1 ? `, part ${current.partIndex + 1} of ${current.total}` : ''}`;
          }
        });
        function showScreen(index, focus = true, force = false) {
          if (!page.ready) return;
          const target = Math.max(0, Math.min(index, page.screens.length));
          if (!force && target === page.screen) return;
          page.screen = target;
          const review = page.screen === page.screens.length;
          const current = page.screens[page.screen];
          page.questionLayouts.forEach(({ card }, questionIndex) => {
            card.hidden = desktop.matches && (review || questionIndex !== current.questionIndex);
          });
          page.screens.forEach(({ part }, partIndex) => {
            if (part) part.hidden = desktop.matches && partIndex !== page.screen;
          });
          form.classList.toggle('review', desktop.matches && review);
          panel.hidden = desktop.matches && !review;
          actions.hidden = desktop.matches && !review;
          if (focus && desktop.matches) {
            const heading = review ? reviewHeading : (current.part.querySelector('h2') ?? current.part.querySelector('h1'));
            heading.focus({ preventScroll: true });
            window.scrollTo({ top: 0, behavior: 'instant' });
          }
        }

        function repack() {
          if (!page.ready) return;
          if (page.pointerDown) {
            page.repackPending = true;
            return;
          }
          if (!desktop.matches && page.packedDesktop === false) return;
          page.packing = true;
          page.packedDesktop = desktop.matches;
          page.desktopMode = desktop.matches;
          const active = document.activeElement;
          const activeQuestion = page.questionLayouts.findIndex(({ card }) => card.contains(active));
          const reviewing = page.screens.length > 0 && page.screen === page.screens.length;
          const questionIndex = activeQuestion >= 0 ? activeQuestion : (page.screens[page.screen]?.questionIndex ?? 0);
          const partIndex = page.screens[page.screen]?.partIndex ?? 0;
          questionsRoot.hidden = false;
          form.classList.remove('review');
          panel.hidden = desktop.matches;
          actions.hidden = desktop.matches;
          masthead.hidden = false;
          form.before(masthead);
          const main = document.querySelector('main');
          main.style.setProperty('--progress-bottom', `${document.querySelector('.progress').getBoundingClientRect().bottom}px`);
          main.style.setProperty('--navigation-height', `${document.querySelector('.navigation').getBoundingClientRect().height}px`);
          page.screens = [];
          page.questionLayouts.forEach(({ card, content, answer, blocks, contentBlocks, answerBlocks, lists }, index) => {
            card.hidden = false;
            blocks.forEach((block) => block.classList.remove('oversized-block'));
            content.replaceChildren(...contentBlocks);
            answer.replaceChildren(...answerBlocks);
            lists.forEach(({ list, items, parent, nextSibling }) => {
              list.classList.remove('oversized-block');
              list.replaceChildren(...items);
              parent.insertBefore(list, nextSibling);
            });
            card.replaceChildren(content, answer);
            if (!desktop.matches) {
              page.screens.push({ questionIndex: index, partIndex: 0, total: 1 });
              return;
            }
            card.replaceChildren();
            const parts = [];
            let part;
            let columns;
            let columnIndex;
            function startPart() {
              part = document.createElement('div');
              part.className = 'question-part';
              if (parts.length) {
                const heading = document.createElement('h2');
                heading.className = 'part-heading';
                heading.tabIndex = -1;
                heading.textContent = `${spec.questions[index].header}: ${spec.questions[index].question}`;
                part.append(heading);
              }
              const grid = document.createElement('div');
              grid.className = 'part-columns';
              columns = Array.from({ length: card.classList.contains('with-context') ? 2 : 1 }, () => {
                const column = document.createElement('div');
                column.className = 'screen-column';
                grid.append(column);
                return column;
              });
              columnIndex = 0;
              part.append(grid);
              card.append(part);
              parts.push(part);
            }
            startPart();
            const desktopBlocks = blocks.flatMap((block) => {
              const nested = lists.filter(({ parent }) => parent === block);
              nested.forEach(({ list }) => list.remove());
              return [block, ...nested.map(({ list }) => list)];
            });
            const questionBlocks = index === 0 ? [masthead, ...desktopBlocks] : desktopBlocks;
            function placeBlock(block) {
              if (columnIndex === columns.length) startPart();
              let placed = false;
              while (!placed) {
                const column = columns[columnIndex];
                const occupied = column.children.length > 0;
                column.append(block);
                const available = column.getBoundingClientRect().height;
                const height = block.getBoundingClientRect().height;
                const fits = block.getBoundingClientRect().bottom <= column.getBoundingClientRect().bottom + .5;
                if (fits) {
                  placed = true;
                } else {
                  block.remove();
                  if (height > available) {
                    if (columns.some((item) => item.children.length)) startPart();
                    columns[0].append(block);
                    block.classList.add('oversized-block');
                    placed = true;
                    // A tall block owns its screen; the next block starts a new part.
                    columnIndex = columns.length;
                  } else if (occupied && columnIndex + 1 < columns.length) {
                    columnIndex++;
                  } else {
                    startPart();
                  }
                }
              }
            }
            questionBlocks.forEach((block) => {
              if (!block.matches('ul')) {
                placeBlock(block);
                return;
              }
              const bullets = [...block.children];
              block.replaceChildren();
              let fragment = block;
              bullets.forEach((bullet) => {
                if (!fragment.children.length) {
                  fragment.append(bullet);
                  placeBlock(fragment);
                } else {
                  fragment.append(bullet);
                  if (fragment.getBoundingClientRect().bottom > columns[columnIndex].getBoundingClientRect().bottom + .5) {
                    bullet.remove();
                    fragment = block.cloneNode(false);
                    fragment.classList.remove('oversized-block');
                    fragment.append(bullet);
                    if (columnIndex + 1 < columns.length) columnIndex++;
                    else startPart();
                    placeBlock(fragment);
                  }
                }
                if (fragment.classList.contains('oversized-block')) {
                  fragment = block.cloneNode(false);
                  fragment.classList.remove('oversized-block');
                }
              });
            });
            parts.forEach((element, position) => {
              const grid = element.querySelector('.part-columns');
              grid.classList.toggle('single-column', grid.children.length === 2 && !grid.lastElementChild.children.length);
              page.screens.push({ questionIndex: index, partIndex: position, total: parts.length, part: element });
            });
          });
          const activeScreen = page.screens.findIndex(({ part }) => part?.contains(active));
          const target = activeScreen >= 0 ? activeScreen : page.screens.findIndex((item) => item.questionIndex === questionIndex && item.partIndex === Math.min(partIndex, item.total - 1));
          page.showScreen(reviewing && activeQuestion < 0 ? page.screens.length : target, false, true);
          page.packing = false;
          if (activeScreen >= 0 || activeQuestion >= 0) {
            active.focus({ preventScroll: true });
            const scrollingBlock = active.closest('.oversized-block');
            if (scrollingBlock) {
              const field = active.getBoundingClientRect();
              const bounds = scrollingBlock.getBoundingClientRect();
              if (field.bottom > bounds.bottom) scrollingBlock.scrollTop += field.bottom - bounds.bottom;
              else if (field.top < bounds.top) scrollingBlock.scrollTop += field.top - bounds.top;
            }
          }
        }

        function scheduleRepack() {
          if (page.isRead) return;
          window.cancelAnimationFrame(page.layoutFrame);
          if (page.pointerDown) {
            page.repackPending = true;
            return;
          }
          page.layoutFrame = window.requestAnimationFrame(page.repack);
        }

        function changeQuestion(index) {
          page.showScreen(page.screens.findIndex((item) => item.questionIndex === index));
          if (!desktop.matches) {
            const heading = questionsRoot.children[index].querySelector('h2');
            heading.focus({ preventScroll: true });
            heading.scrollIntoView({ block: 'start' });
          }
        }

        function updateReview(answers = collectAnswers()) {
          answers.forEach((answer, index) => {
            const copy = document.createElement('div');
            const header = document.createElement('span');
            header.className = 'header';
            header.textContent = answer.header;
            const heading = document.createElement('h3');
            heading.textContent = answer.question;
            copy.append(header, heading);
            const labels = [...answer.choices];
            if (answer.otherSelected) labels.push(`Other: ${answer.other}`);
            if (!labels.length) labels.push(answer.skipped ? 'Skipped' : 'Not answered');
            labels.forEach((label) => {
              const text = document.createElement('p');
              text.textContent = label;
              copy.append(text);
            });
            if (answer.note) {
              const note = document.createElement('p');
              note.textContent = `Note: ${answer.note}`;
              copy.append(note);
            }
            const row = rows.children[index];
            if (row) {
              // Keep the pressed Change button attached when a text field's blur updates answers.
              row.firstElementChild.replaceWith(copy);
            } else {
              const newRow = document.createElement('div');
              newRow.className = 'answer-row';
              const change = document.createElement('button');
              change.type = 'button';
              change.className = 'change';
              change.textContent = 'Change';
              change.setAttribute('aria-label', `Change ${answer.header}`);
              change.setAttribute('x-on:click', `changeQuestion(${index})`);
              newRow.append(copy, change);
              rows.append(newRow);
            }
          });
        }

        function readDraft() {
          try {
            const value = window.localStorage.getItem(storageKey);
            return value ? JSON.parse(value) : null;
          } catch {
            return null;
          }
        }

        function writeDraft(value) {
          try {
            window.localStorage.setItem(storageKey, JSON.stringify(value));
          } catch {
            return;
          }
        }

        function removeDraft() {
          try {
            window.localStorage.removeItem(storageKey);
          } catch {
            return;
          }
        }

        function answersUrl() {
          const url = new URL(window.location.href);
          url.hash = '';
          url.search = '';
          url.pathname = `${url.pathname.replace(/\/$/, '')}/answers`;
          return url;
        }

        function makeOption(question, questionIndex, option, optionIndex) {
          const label = document.createElement('label');
          label.className = 'option';

          const input = document.createElement('input');
          input.type = question.multiSelect ? 'checkbox' : 'radio';
          input.name = `question-${questionIndex}`;
          input.value = option.label;
          input.dataset.choice = 'true';
          input.setAttribute('aria-label', option.label);
          input.setAttribute('x-bind:checked', `isChoiceSelected(${questionIndex}, ${optionIndex})`);
          input.setAttribute('x-on:change', `choose(${questionIndex}, ${optionIndex}, $event)`);

          const copy = document.createElement('span');
          copy.className = 'option-copy';
          const top = document.createElement('span');
          top.className = 'option-top';
          const optionLabel = document.createElement('span');
          optionLabel.className = 'option-label';
          optionLabel.textContent = option.label;
          top.append(optionLabel);

          if (option.recommended) {
            const chip = document.createElement('span');
            chip.className = 'chip';
            chip.textContent = 'Recommended';
            top.append(chip);
          }

          const description = document.createElement('span');
          description.className = 'option-description';
          description.textContent = option.description;
          copy.append(top, description);
          label.append(input, copy);
          return label;
        }

        function renderQuestion(question, index) {
          const card = document.createElement('section');
          card.setAttribute('role', 'group');
          card.setAttribute('aria-labelledby', `question-heading-${index}`);
          card.className = 'question-card';
          card.dataset.questionId = question.id;
          card.setAttribute('x-bind:data-skipped', `drafts[${index}].skipped`);

          const content = document.createElement('div');
          content.className = 'question-content';
          const answer = document.createElement('div');
          answer.className = 'question-answer';
          if (question.context || question.cards || question.table) card.classList.add('with-context');
          const questionHeading = document.createElement('div');
          const meta = document.createElement('div');
          meta.className = 'question-meta';
          const header = document.createElement('span');
          header.className = 'header';
          header.textContent = question.header;
          const count = document.createElement('span');
          count.className = 'count';
          count.textContent = `${index + 1} of ${spec.questions.length}`;
          meta.append(header, count);

          const heading = document.createElement('h2');
          heading.textContent = question.question;
          heading.id = `question-heading-${index}`;
          heading.tabIndex = -1;
          heading.style.scrollMarginTop = '64px';
          questionHeading.append(meta, heading);
          content.append(questionHeading);
          card.append(content, answer);

          const rendered = renderBlocks(question);
          if (rendered.context) questionHeading.append(rendered.context);
          if (rendered.cards) content.append(rendered.cards);
          if (rendered.table) content.append(rendered.table);
          answer.append(...rendered.flows);

          const options = document.createElement('div');
          options.className = 'options';
          const controls = document.createElement('div');
          controls.className = 'answer-controls';
          question.options.forEach((option, optionIndex) => {
            options.append(page.makeOption(question, index, option, optionIndex));
          });

          const otherLabel = document.createElement('label');
          otherLabel.className = 'option';
          const otherToggle = document.createElement('input');
          otherToggle.type = question.multiSelect ? 'checkbox' : 'radio';
          otherToggle.name = `question-${index}`;
          otherToggle.value = '__other__';
          otherToggle.dataset.otherToggle = 'true';
          otherToggle.setAttribute('aria-label', 'Other');
          otherToggle.setAttribute('x-bind:checked', `drafts[${index}].otherSelected`);
          otherToggle.setAttribute('x-on:change', `chooseOther(${index}, $event)`);
          const otherCopy = document.createElement('span');
          otherCopy.className = 'option-copy';
          const otherName = document.createElement('span');
          otherName.className = 'option-label';
          otherName.textContent = 'Other';
          const otherDescription = document.createElement('span');
          otherDescription.className = 'option-description';
          otherDescription.textContent = 'Write a different answer in your own words.';
          otherCopy.append(otherName, otherDescription);
          otherLabel.append(otherToggle, otherCopy);
          options.append(otherLabel);
          controls.append(options);

          const otherField = document.createElement('div');
          otherField.className = 'other-input';
          otherField.setAttribute('x-bind:hidden', `!drafts[${index}].otherSelected`);
          const otherTextLabel = document.createElement('label');
          otherTextLabel.className = 'field-label';
          otherTextLabel.htmlFor = `other-${index}`;
          otherTextLabel.textContent = 'Other response';
          const otherText = document.createElement('input');
          otherText.type = 'text';
          otherText.id = `other-${index}`;
          otherText.setAttribute('x-model', `drafts[${index}].other`);
          otherText.setAttribute('x-on:input', `editAnswer(${index})`);
          otherField.append(otherTextLabel, otherText);

          const noteField = document.createElement('div');
          noteField.className = 'note-field';
          const noteLabel = document.createElement('label');
          noteLabel.className = 'field-label';
          noteLabel.htmlFor = `note-${index}`;
          noteLabel.textContent = 'Note (optional)';
          const note = document.createElement('textarea');
          note.id = `note-${index}`;
          note.rows = 3;
          note.setAttribute('x-model', `drafts[${index}].note`);
          note.setAttribute('x-on:input', 'saveDraft');
          noteField.append(noteLabel, note);

          const skip = document.createElement('button');
          skip.type = 'button';
          skip.className = 'skip';
          skip.textContent = 'Skip this question';
          skip.setAttribute('x-on:click', `skipQuestion(${index})`);
          controls.append(otherField, noteField, skip);
          answer.append(controls);
          const contentBlocks = [...content.children];
          const answerBlocks = [...answer.children];
          const blocks = [...contentBlocks, ...answerBlocks];
          const lists = blocks.flatMap((block) => block.matches('ul') ? [block] : [...block.children].filter((child) => child.matches('ul')))
            .map((list) => ({ list, items: [...list.children], parent: list.parentElement, nextSibling: list.nextSibling }));
          page.questionLayouts.push({ card, content, answer, contentBlocks, answerBlocks, blocks, lists });
          let noteHeight = note.getBoundingClientRect().height;
          new ResizeObserver(() => {
            const height = note.getBoundingClientRect().height;
            if (height) {
              const resized = noteHeight > 0 && height !== noteHeight;
              noteHeight = height;
              if (resized) page.scheduleRepack();
            }
          }).observe(note);
          return card;
        }

        function collectAnswers() {
          return spec.questions.map((question, index) => {
            const draft = page.drafts[index];
            return {
              id: question.id,
              header: question.header,
              question: question.question,
              choices: question.options.filter((option) => draft.choices.includes(option.label)).map((option) => option.label),
              other: draft.otherSelected ? draft.other.trim() : '',
              note: draft.note.trim(),
              otherSelected: draft.otherSelected,
              skipped: draft.skipped
            };
          });
        }

        function saveDraft() {
          if (page.packing) return;
          const answers = page.collectAnswers();
          const value = {};
          answers.forEach((answer, index) => {
            value[answer.id] = {
              choices: answer.choices,
              otherSelected: answer.otherSelected,
              other: page.drafts[index].other,
              note: answer.note,
              skipped: answer.skipped
            };
          });
          page.writeDraft(value);
          page.updateReview(answers);
        }

        function showLatest(submission) {
          const time = document.createElement('time');
          time.dateTime = submission.submittedAt;
          time.textContent = new Date(submission.submittedAt).toLocaleString();
          latestText.replaceChildren(document.createTextNode('Latest submission: '), time);
          latest.hidden = false;
          latestError.hidden = true;
        }

        function hideToast() {
          window.clearTimeout(page.toastTimer);
          toast.hidden = true;
        }

        function showToast(message, type) {
          page.hideToast();
          toast.classList.toggle('error-toast', type === 'error');
          toast.setAttribute('role', type === 'error' ? 'alert' : 'status');
          const icon = document.createElement('i');
          icon.dataset.lucide = type === 'error' ? 'circle-alert' : 'check-circle-2';
          icon.setAttribute('aria-hidden', 'true');
          const text = document.createElement('span');
          text.textContent = message;
          toast.replaceChildren(icon, text);
          toast.hidden = false;
          window.lucide?.createIcons();
          page.toastTimer = window.setTimeout(() => { toast.hidden = true; }, 4000);
        }

        async function loadLatest() {
          try {
            const response = await fetch(page.answersUrl(), { headers: { Accept: 'application/json' }, credentials: 'same-origin' });
            if (response.status === 404) return null;
            if (!response.ok) throw new Error(`request failed with ${response.status}`);
            const submission = await response.json();
            page.showLatest(submission);
            return submission;
          } catch {
            latestError.textContent = 'The latest submission could not be checked. Your unsent answers are still here.';
            latestError.hidden = false;
            return null;
          }
        }

        function submissionDraft(submission) {
          return Object.fromEntries(submission.answers.map((answer) => [answer.id, {
            choices: answer.choices,
            otherSelected: Boolean(answer.other),
            other: answer.other,
            note: answer.note
          }]));
        }

        async function init() {
          document.title = spec.title;
          if (page.isRead) {
            document.body.classList.add('read-page');
            document.body.dataset.pageType = 'read';
            await page.$nextTick();
            document.querySelector('.progress').remove();
            document.querySelector('.navigation').remove();
            form.remove();
            latest.remove();
            latestError.remove();
            toast.remove();
            const sections = document.createElement('div');
            sections.className = 'read-sections';
            spec.sections.forEach((section, index) => sections.append(renderSection(section, index)));
            masthead.after(sections);
            window.lucide?.createIcons();
            return;
          }
          panel.hidden = desktop.matches;
          actions.hidden = desktop.matches;
          const localDraft = page.readDraft();
          const submission = await page.loadLatest();
          const draft = localDraft ?? (submission ? page.submissionDraft(submission) : {});
          page.drafts = spec.questions.map((question) => ({
            choices: [], otherSelected: false, other: '', note: '', skipped: false,
            ...draft[question.id]
          }));
          spec.questions.forEach((question, index) => questionsRoot.append(page.renderQuestion(question, index)));
          page.updateReview();
          window.lucide?.createIcons();
          page.ready = true;
          await page.$nextTick();
          page.repack();
          document.fonts.ready.then(() => page.scheduleRepack());
        }

        function isChoiceSelected(index, optionIndex) {
          return page.drafts[index].choices.includes(spec.questions[index].options[optionIndex].label);
        }

        function choose(index, optionIndex, event) {
          const draft = page.drafts[index];
          const question = spec.questions[index];
          const label = question.options[optionIndex].label;
          const otherWasSelected = draft.otherSelected;
          draft.choices = question.multiSelect ? (event.target.checked ? [...draft.choices, label] : draft.choices.filter((choice) => choice !== label)) : [label];
          if (!question.multiSelect) draft.otherSelected = false;
          draft.skipped = false;
          page.saveDraft();
          if (otherWasSelected !== draft.otherSelected) page.$nextTick(() => page.scheduleRepack());
        }

        function chooseOther(index, event) {
          const focused = document.activeElement;
          const draft = page.drafts[index];
          draft.otherSelected = event.target.checked;
          if (!spec.questions[index].multiSelect && draft.otherSelected) draft.choices = [];
          draft.skipped = false;
          page.saveDraft();
          page.$nextTick(() => {
            if (draft.otherSelected && document.activeElement === focused) document.getElementById(`other-${index}`).focus();
            page.scheduleRepack();
          });
        }

        function editAnswer(index) {
          page.drafts[index].skipped = false;
          page.saveDraft();
        }

        function skipQuestion(index) {
          const draft = page.drafts[index];
          const otherWasSelected = draft.otherSelected;
          draft.choices = [];
          draft.otherSelected = false;
          draft.other = '';
          draft.skipped = true;
          page.saveDraft();
          if (otherWasSelected) page.$nextTick(() => page.scheduleRepack());
        }

        function pointerReleased() {
          page.pointerDown = false;
          if (page.repackPending) {
            page.repackPending = false;
            page.scheduleRepack();
          }
        }

        function keyboardNavigation(event) {
          if (!page.ready || !desktop.matches || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey || event.target.closest('textarea, input, [contenteditable], .table-wrap')) return;
          if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
            event.preventDefault();
            page.showScreen(page.screen + (event.key === 'ArrowRight' ? 1 : -1));
          }
        }

        function previousScreen() {
          page.showScreen(page.screen - 1);
        }

        function nextScreen() {
          page.showScreen(page.screen + 1);
        }

        async function submitAnswers() {
          if (!page.ready) return;
          page.hideToast();
          error.hidden = true;
          reply.textContent = '';
          const answers = page.collectAnswers();
          const missingOther = answers.find((answer) => answer.otherSelected && !answer.other);
          if (missingOther) {
            error.textContent = 'Write the Other response or choose Skip this question.';
            error.hidden = false;
            const card = questionsRoot.querySelector(`[data-question-id="${CSS.escape(missingOther.id)}"]`);
            if (desktop.matches) {
              page.repack();
              page.showScreen(page.screens.findIndex(({ part }) => part.contains(card.querySelector('.other-input input'))));
            }
            card.querySelector('.other-input input').focus();
            if (!desktop.matches) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
          }
          if (desktop.matches && page.screen !== page.screens.length) {
            page.showScreen(page.screens.length);
            return;
          }

          const submission = {
            submittedAt: new Date().toISOString(),
            answers: answers.map(({ otherSelected, skipped, ...answer }) => answer)
          };
          page.submitting = true;
          try {
            const response = await fetch(page.answersUrl(), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              credentials: 'same-origin',
              body: JSON.stringify(submission)
            });
            if (!response.ok) throw new Error(`request failed with ${response.status}`);
            page.removeDraft();
            page.showLatest(submission);
